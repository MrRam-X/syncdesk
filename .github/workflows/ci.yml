name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Type-Check Verification
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js (v20 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install Monorepo Dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Verify Server TypeScript Build
      - name: Check Server Build
        run: npm run build --workspace=server

      # 5. Verify Client TypeScript Build
      - name: Check Client Build
        run: npm run build --workspace=client